<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOCAGRID Online Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body class="online-lobby-body">
  <div class="screen start online-lobby">
    <h1>VOCAGRID Online</h1>
    <p>
      This is the experimental online mode lobby.
      For now it simply opens the online battle screen and lets you return to the title.
    </p>

    <div class="online-actions">
      <button id="goOnlineGame" class="btn primary">Play Online (beta)</button>
      <button id="backToTitle" class="btn ghost">Back to Title</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const goOnlineGame = document.getElementById("goOnlineGame");
      const backToTitle = document.getElementById("backToTitle");

      if (goOnlineGame) {
        goOnlineGame.addEventListener("click", function () {
          window.location.href = "online-game.html";
        });
      }
      if (backToTitle) {
        backToTitle.addEventListener("click", function () {
          // タイトル画面のファイル名は index (1).html を想定
          window.location.href = "index (1).html";
        });
      }
    });
  </script>
</body>
</html>
